<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recordatorio</title>
  <meta name="description" content="Tus sitios pendientes, recetas e ideas en un mapa.">
  <meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F151A" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Recordatorio">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><h1>Recordatorio</h1></div>
      <label class="search" for="q">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar sitio, receta, ingrediente…" autocomplete="off" aria-label="Buscar">
      </label>
      <label class="btn" for="quickCam" title="Haz una foto y guárdala con tu ubicación">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        Foto
      </label>
      <input type="file" id="quickCam" accept="image/*" capture="environment" hidden>
      <button class="btn primary" id="addBtn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Añadir
      </button>
    </header>

    <main class="grid">
      <section class="mapwrap" aria-label="Mapa">
        <div id="map"></div>
        <form class="mapsearch" id="mapSearch" role="search">
          <input id="mapSearchIn" type="search" placeholder="Buscar en el mapa: local, museo, dirección…" aria-label="Buscar en el mapa" autocomplete="off">
          <button type="button" id="mapSearchClear" aria-label="Quitar resultados" hidden>×</button>
          <button type="submit" class="btn small">Buscar</button>
        </form>
        <div class="poihint" id="poiHint" hidden></div>
        <button class="mapbtn" id="locateBtn" type="button" aria-label="Ir a mi ubicación" title="Mi ubicación">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </button>
        <div class="pickbar" id="pickbar" hidden>Toca el mapa donde está <button type="button" id="pickCancel">Cancelar</button></div>
        <div class="card" id="card" hidden></div>
      </section>

      <aside class="side">
        <div class="listbar">
          <label for="listSel">Lista</label>
          <select id="listSel"></select>
          <button class="btn ghost small" type="button" id="editListBtn" hidden>Editar</button>
          <button class="btn ghost small" type="button" id="newListBtn">+ Nueva</button>
        </div>
        <form class="editlist" id="editListForm" hidden>
          <label for="editListIn">Nombre de la lista</label>
          <div class="inl">
            <input id="editListIn" aria-label="Nombre de la lista" maxlength="60">
            <button class="btn primary small" type="submit">Guardar</button>
          </div>
          <div class="row">
            <button class="btn ghost small danger" type="button" id="delListBtn">Quitar lista</button>
            <button class="btn ghost small" type="button" id="editListCancel">Cancelar</button>
          </div>
          <p class="hint">Quitar la lista no borra nada: sus sitios siguen en «Todas».</p>
        </form>
        <form class="inl newlist" id="newListForm" hidden>
          <input id="newListIn" placeholder="Ej. Lisboa mayo, Madrid…" aria-label="Nombre de la lista" maxlength="60">
          <button class="btn" type="submit">Crear</button>
        </form>
        <div class="tabs" role="tablist">
          <button role="tab" id="tabPend" aria-selected="true" type="button">Pendientes</button>
          <button role="tab" id="tabDone" aria-selected="false" type="button">Visitados</button>
          <button role="tab" id="tabMore" aria-selected="false" type="button">Más</button>
        </div>
        <div class="pane" id="paneList">
          <div class="filters">
            <div class="flabel">Tipo</div>
            <div class="fcats" id="fcats"></div>
            <div class="ftags" id="ftags" hidden></div>
            <div class="fextra">
              <div class="flabel" id="fperiodLabel">Cuándo</div><div class="seg" id="fperiod"></div>
              <div class="flabel">Orden</div><div class="seg" id="forder"></div>
            </div>
          </div>
          <div class="list" id="list"></div>
        </div>
        <div class="pane more" id="paneMore" hidden></div>
      </aside>
    </main>
  </div>


  <div class="overlay" id="overlay" hidden>
    <form class="sheet" id="form" autocomplete="off" novalidate>
      <h2 id="formTitle">Añadir sitio</h2>
      <div class="field">
        <span class="label">Tipo</span>
        <div class="catpick" id="catpick"></div>
      </div>
      <div class="field" id="nearField" hidden>
        <span class="label">¿Es alguno de estos sitios de al lado?</span>
        <div class="nearlist" id="nearList"></div>
      </div>
      <div class="field" id="attachField" hidden>
        <label for="attachSel">¿Es de algo que ya tienes guardado?</label>
        <div class="inl">
          <select id="attachSel"></select>
          <button class="btn" type="button" id="attachBtn">Añadir el enlace ahí</button>
        </div>
      </div>
      <div class="field" id="locField">
        <label for="fLink">Ubicación: enlace de Google Maps, dirección o coordenadas</label>
        <div class="inl">
          <input id="fLink" placeholder="Pega el enlace o escribe la dirección">
          <button class="btn" type="button" id="geoBtn">Buscar</button>
        </div>
        <div class="hint" id="linkHint"></div>
        <ul class="georesults" id="geoResults" hidden></ul>
        <div class="locstate" id="locState"></div>
      </div>
      <div class="field">
        <label for="fName">Nombre</label>
        <input id="fName" required>
      </div>
      <div class="field">
        <label for="fDesc">Descripción</label>
        <textarea id="fDesc"></textarea>
      </div>
      <div class="field" id="ingrField" hidden>
        <label for="fIngr">Ingredientes</label>
        <textarea id="fIngr" placeholder="Uno por línea o separados por comas"></textarea>
      </div>
      <div class="field" id="statusField">
        <span class="label">Estado</span>
        <div class="seg" id="statusSeg">
          <button type="button" data-s="pend" aria-pressed="true">Pendiente</button>
          <button type="button" data-s="done" aria-pressed="false" id="statusDoneBtn">Ya he estado</button>
        </div>
        <div class="vform" id="doneFields" hidden>
          <input type="date" id="fVisitDate" aria-label="Fecha">
          <div class="starpick" id="fStars" role="group" aria-label="Valoración"></div>
          <textarea id="fVisitNote" aria-label="Comentario de la visita"></textarea>
        </div>
      </div>
      <div class="field">
        <span class="label">Fotos</span>
        <div class="thumbs" id="fPhotos"></div>
        <div class="row">
          <label class="btn small" for="fCam">Hacer foto</label>
          <input type="file" id="fCam" accept="image/*" capture="environment" hidden>
          <label class="btn small ghost" for="fGal">Desde la galería</label>
          <input type="file" id="fGal" accept="image/*" multiple hidden>
          <span class="hint" id="fPhotoInfo"></span>
        </div>
      </div>
      <div class="field">
        <label for="fTags">Etiquetas <span class="hint">(separadas por comas: terraza, barato, con niños)</span></label>
        <input id="fTags" placeholder="#terraza #barato">
        <div class="tagsugg" id="tagSugg"></div>
      </div>
      <div class="field">
        <span class="label">Listas <span class="hint">(viajes o ciudades)</span></span>
        <div class="listpick" id="listPick"></div>
      </div>
      <div class="field">
        <span class="label">Visto en <span class="hint">(TikTok, Instagram, YouTube…)</span></span>
        <div class="socials" id="socials"></div>
        <button type="button" class="btn ghost small" id="addSocial">+ Añadir enlace</button>
      </div>
      <div class="formerr" id="formErr" hidden></div>
      <div class="actions">
        <button class="btn ghost" type="button" id="fCancel">Cancelar</button>
        <button class="btn primary" type="submit" id="fSubmit">Guardar</button>
      </div>
    </form>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <img id="lightImg" alt="Foto de la visita">
    <button type="button" id="lightClose" aria-label="Cerrar foto">×</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
